name: Python CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Format Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .
